version: '3.8'
services:
  development-image:
    profiles: [tools]
    image: ${JARVIS_RUNTIME_PREFIX:-jarvis}-development:current
    build:
      context: .
      dockerfile: infra/development/Dockerfile
    entrypoint: [node, --version]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécutez npm run setup}
    ports: ['127.0.0.1:${JARVIS_DB_PORT:-55432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jarvis -d jarvis']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  temporal-db:
    profiles: [app]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [temporal-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  temporal:
    profiles: [app]
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE: config/dynamicconfig/development-sql.yaml
    depends_on:
      temporal-db: { condition: service_healthy }
    restart: unless-stopped
  github:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/GitHub.Dockerfile
    environment:
      JARVIS_SUPERVISOR_TOKEN: ${JARVIS_SUPERVISOR_TOKEN}
    volumes: [github-state:/state, github-sources:/sources]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:7081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  supervisor:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/Supervisor.Dockerfile
    environment:
      JARVIS_SUPERVISOR_TOKEN: ${JARVIS_SUPERVISOR_TOKEN:?Exécutez npm run setup}
      JARVIS_VAULT_KEY: ${JARVIS_VAULT_KEY:?Exécutez npm run setup}
      JARVIS_RUNTIME_PREFIX: ${JARVIS_RUNTIME_PREFIX:-jarvis}
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        JARVIS_SOURCE_COMMIT: ${JARVIS_SOURCE_COMMIT:-unconfigured}
    command: [./node_modules/.bin/tsx, apps/workflow-worker/main.ts]
    environment:
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@db:5432/jarvis
      TEMPORAL_ADDRESS: temporal:7233
      JARVIS_SUPERVISOR_URL: http://supervisor:7080
      JARVIS_SUPERVISOR_TOKEN: ${JARVIS_SUPERVISOR_TOKEN}
      JARVIS_INITIAL_HARNESSES: ${JARVIS_INITIAL_HARNESSES:-codex,claude-code}
    depends_on:
      db: { condition: service_healthy }
      temporal: { condition: service_started }
      supervisor: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  release-controller:
    profiles: [app]
    init: true
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: release-controller
      args:
        JARVIS_SOURCE_COMMIT: ${JARVIS_SOURCE_COMMIT:-unconfigured}
    environment:
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@db:5432/jarvis
      JARVIS_SUPERVISOR_TOKEN: ${JARVIS_SUPERVISOR_TOKEN}
      JARVIS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-jarvis}
    volumes:
      [/var/run/docker.sock:/var/run/docker.sock, github-sources:/sources:ro, release-state:/state]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      db: { condition: service_healthy }
      github: { condition: service_healthy }
    restart: unless-stopped
  whisper:
    profiles: [app, voice]
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    environment:
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: 4
      LOG_LEVEL: warning
      ENABLE_UI: 'false'
      OPENBLAS_NUM_THREADS: 1
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes: [whisper-models:/home/ubuntu/.cache/huggingface]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, 'seccomp:./infra/speaches-seccomp.json']
    mem_limit: 3g
    cpus: 4
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
  app:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        JARVIS_SOURCE_COMMIT: ${JARVIS_SOURCE_COMMIT:-unconfigured}
    init: true
    environment:
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@db:5432/jarvis
      JARVIS_OWNER_PASSWORD: ${JARVIS_OWNER_PASSWORD:?Exécutez npm run setup}
      APP_ORIGIN: ${JARVIS_PUBLIC_ORIGIN:-http://localhost:3000}
      WHISPER_URL: http://whisper:8000
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      HARNESS_MODE: live
      JARVIS_SUPERVISOR_URL: http://supervisor:7080
      JARVIS_SUPERVISOR_TOKEN: ${JARVIS_SUPERVISOR_TOKEN}
    depends_on:
      db: { condition: service_healthy }
    ports: ['127.0.0.1:${JARVIS_HTTP_PORT:-3000}:3000']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  release-state:
  github-state:
  github-sources:
    name: ${JARVIS_RUNTIME_PREFIX:-jarvis}-github-sources
  whisper-models:
  postgres-data:
  temporal-data:
