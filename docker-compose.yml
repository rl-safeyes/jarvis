version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Générez .env avec npm run setup}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jarvis -d jarvis']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/Dockerfile
    init: true
    environment:
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@db:5432/jarvis
      JARVIS_OWNER_PASSWORD: ${JARVIS_OWNER_PASSWORD:?Générez .env avec npm run setup}
      APP_ORIGIN: ${JARVIS_PUBLIC_ORIGIN:-http://localhost:3000}
      HARNESS_MODE: mock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgres-data:
