name: Jarvis checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis-ci-only
          POSTGRES_DB: jarvis
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U jarvis -d jarvis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://jarvis:jarvis-ci-only@127.0.0.1:5432/jarvis
      DATABASE_URL: postgresql://jarvis:jarvis-ci-only@127.0.0.1:5432/jarvis
      JARVIS_OWNER_PASSWORD: jarvis-ci-owner-password-only
      E2E_OWNER_PASSWORD: jarvis-ci-owner-password-only
      HARNESS_MODE: mock
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          node --import tsx apps/api/src/server.ts > /tmp/jarvis-api.log 2>&1 &
          npx vite --config apps/web/vite.config.ts > /tmp/jarvis-web.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/healthz && curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
